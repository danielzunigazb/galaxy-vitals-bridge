org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Kotlin 1.9.24's daemon crashes flushing incremental-compile caches on JDK 24+
# (Android Studio's bundled JBR is 25.0.3): its embedded JavaVersion parser
# can't read "25.0.3". Incremental compilation is what triggers that cache
# flush, so disabling it avoids the crash without needing an older JDK.
kotlin.incremental=false
